[project]
name = "pooks"
version = "0.1.0"
description = "Ranked new-arrival pipeline for oldbookdepot.in"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "selectolax>=0.3.21",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
]

[project.scripts]
pooks = "pooks.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pooks"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
